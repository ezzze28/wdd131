<!doctype html>
<html lang="en">
  <head>

    <title>WDD 131 – Temple Album – Ezequiel Nicoliadkis</title>
    <meta
      name="description"
      content="A picture album featuring nine temples from around the world, created by Kaylee Godfrey for WDD 131 Dynamic Web Fundamentals."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <body>
    <header>
      <span id="course-title">Temple Album</span>
      <button
        id="menu-toggle"
        aria-label="Toggle navigation menu"
        aria-expanded="false"

        &#9776;

      <nav id="main-nav" aria-label="Main navigation">

        <a href="#">Small</a>

    <main>
      <h1>Temples of the World</h1>

      <div class="gallery">
        <figure>
          <img

            loading="lazy"

            height="300"
          />

        </figure>

        <figure>

            src="images/cordoba.jpg"

          />

        </figure>

        <figure>
          <img
            src="images/gilbertarizona.jpg"
            alt="Gilbert, Arizona Temple"
            loading="lazy"
            width="400"
            height="300"
          />
          <figcaption>Gilbert, Arizona Temple</figcaption>
        </figure>

        <figure>
          <img
            src="images/london.jpg"
            alt="London Temple"
            loading="lazy"
            width="400"
            height="300"
          />
          <figcaption>London, UK Temple</figcaption>

        <figure>
          <img
            src="images/mesaarizona.jpeg"

        <figure>

            loading="lazy"
            width="400"
            height="300"
          />
          <figcaption>Manhattan Temple</figcaption>
        </figure>

        <figure>
          <img
            src="images/riojaneiro.jpeg"
            alt="Rio De Janeiro, Brazil Temple rendering"
            loading="lazy"
            width="400"
            height="300"
          />
          <figcaption>Rio De Janeiro, Brazil Temple</figcaption>
        </figure>
